[package]
name = "display-sim-native"
version = "0.1.0"
authors = ["José manuel Barroso Galindo <theypsilon@gmail.com>"]
edition = "2018"

[lib]
test = true

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
image = "0.24.3"
egui = { workspace = true }
egui_glow = { workspace = true }
glm = { version = "0.17", package = "nalgebra-glm" }
render = { path = "../display-sim-render", package = "display-sim-render" }
core = { path = "../display-sim-core", package = "display-sim-core" }
sim-ui = { path = "../display-sim-sim-ui", package = "display-sim-sim-ui" }
rand = "0.8.6"
glutin = "0.28.0"
glow = { path = "../glow-safe-adapter", package = "glow-safe-adapter" }
